<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>المحاسب الذكي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="assets/app.css?v=4">
</head>
<body dir="rtl">
    <header class="topbar">
        <div class="who">
            <div class="avatar" id="avatar" aria-hidden="true">•</div>
            <div>
                <div class="who-name" id="whoName">…</div>
                <div class="who-date" id="whoDate"></div>
            </div>
        </div>
        <div class="top-actions">
            <button class="icon-btn" id="refreshButton" type="button" data-i18n-aria="refresh">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
            </button>
            <button class="pill-btn" id="langButton" type="button" data-i18n="langButton">EN</button>
        </div>
    </header>

    <main class="main">
        <div class="state" id="globalLoading"><div class="spinner"></div><div data-i18n="loading"></div></div>
        <div class="state hidden" id="privateState"><div class="state-icon">🔒</div><h2 data-i18n="privateTitle"></h2><p data-i18n="privateText"></p></div>

        <!-- Tasks -->
        <section class="view hidden" data-view="tasks">
            <div class="view-head"><h1 data-i18n="tabTasks"></h1></div>
            <div class="view-error hidden" id="tasksError"></div>
            <div id="tasksContent">
                <div class="hero tasks">
                    <div class="hero-row">
                        <div class="ring-wrap">
                            <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                                <circle class="ring-bg" cx="18" cy="18" r="15.9"></circle>
                                <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.9" stroke-dasharray="0 100"></circle>
                            </svg>
                            <div class="ring-label" id="ringLabel">—</div>
                        </div>
                        <div>
                            <div class="hero-label" id="heroDate"></div>
                            <div class="hero-title" id="heroTitle"></div>
                            <div class="hero-sub" id="heroSub"></div>
                        </div>
                    </div>
                </div>
                <form class="card add-card" id="addTodoForm">
                    <div class="add-row">
                        <input id="newTodo" type="text" maxlength="300" autocomplete="off" data-i18n-placeholder="addPlaceholder">
                        <button class="round-btn" type="submit" aria-label="+">+</button>
                    </div>
                    <div class="chips" id="dayChips">
                        <button class="chip active" type="button" data-day="0" data-i18n="dayToday"></button>
                        <button class="chip" type="button" data-day="1" data-i18n="dayTomorrow"></button>
                    </div>
                </form>
                <div class="card list-card"><div id="openList"></div></div>
                <div class="section-label hidden" id="doneLabel"></div>
                <div class="card list-card hidden" id="doneCard"><div id="doneList"></div></div>
                <div class="section-label hidden" id="tomorrowLabel" data-i18n="tomorrowTitle"></div>
                <div class="card list-card hidden" id="tomorrowCard"><div id="tomorrowList"></div></div>
            </div>
        </section>

        <!-- Habits -->
        <section class="view hidden" data-view="habits">
            <div class="view-head">
                <h1 data-i18n="tabHabits"></h1>
                <button class="head-btn" id="newHabitButton" type="button" aria-label="+">+</button>
            </div>
            <div class="view-error hidden" id="habitsError"></div>
            <div id="habitsContent">
                <div class="hero habits">
                    <div class="hero-label" data-i18n="doneToday"></div>
                    <div class="hero-amount" id="habitsHero"></div>
                    <div class="hero-pills">
                        <div class="hero-pill"><span data-i18n="bestStreak"></span><b id="bestStreak"></b></div>
                        <div class="hero-pill"><span data-i18n="last7"></span><b id="habitsWeek"></b></div>
                    </div>
                </div>
                <div id="habitList"></div>
                <details class="fold hidden" id="habitsPausedBox"><summary id="habitsPausedSummary"></summary><div id="habitsPaused"></div></details>
            </div>
        </section>

        <!-- Accounting -->
        <section class="view hidden" data-view="accounting">
            <div class="view-head"><h1 data-i18n="tabAccounting"></h1></div>
            <div class="view-error hidden" id="accError"></div>
            <div class="state hidden" id="accEmpty"><div class="state-icon">💸</div><h2 data-i18n="emptyText"></h2><p data-i18n="emptyHint"></p></div>
            <div id="accContent" class="hidden">
                <div class="period-bar">
                    <button class="nav-arrow" id="prevMonth" type="button" data-i18n-aria="prevMonth">‹</button>
                    <select class="period-select" id="monthFilter" data-i18n-aria="month"></select>
                    <button class="nav-arrow" id="nextMonth" type="button" data-i18n-aria="nextMonth">›</button>
                    <select class="currency-pill" id="currencyFilter" data-i18n-aria="currency"></select>
                </div>
                <div class="filter-chip hidden" id="categoryChip"><span id="categoryChipLabel"></span><button type="button" id="clearCategory" aria-label="✕">✕</button></div>

                <div class="hero money">
                    <div class="hero-label" id="heroMoneyLabel"></div>
                    <div class="hero-amount" id="heroSpent"></div>
                    <div class="hero-pills">
                        <div class="hero-pill"><span id="heroPill1Label"></span><b id="heroPill1"></b></div>
                        <div class="hero-pill"><span id="heroPill2Label"></span><b id="heroPill2"></b></div>
                    </div>
                </div>

                <div class="card" id="categoryCard">
                    <div class="card-title"><span data-i18n="byCategory"></span></div>
                    <div id="categoryList"></div>
                </div>

                <div class="card" id="trendCard">
                    <div class="card-title"><span id="trendTitle"></span></div>
                    <div class="chart-box"><canvas id="trendChart"></canvas></div>
                    <div class="mini-stats" id="trendStats"></div>
                </div>

                <div class="card flush" id="tableSection">
                    <div class="pad">
                        <div class="card-title"><span data-i18n="transactionsTitle"></span></div>
                        <input class="search" id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
                    </div>
                    <div id="transactionList"></div>
                    <button class="more-button hidden" id="moreButton" type="button"></button>
                </div>
            </div>
        </section>

        <!-- Goals -->
        <section class="view hidden" data-view="goals">
            <div class="view-head">
                <h1 data-i18n="tabGoals"></h1>
                <button class="head-btn" id="newGoalButton" type="button" aria-label="+">+</button>
            </div>
            <div class="view-error hidden" id="goalsError"></div>
            <div id="goalsContent">
                <div class="hero goals">
                    <div class="hero-label" data-i18n="activeGoals"></div>
                    <div class="hero-amount" id="goalsHero"></div>
                    <div class="hero-pills">
                        <div class="hero-pill"><span data-i18n="avgProgress"></span><b id="goalsAvg"></b></div>
                        <div class="hero-pill"><span data-i18n="finishedGoals"></span><b id="goalsDoneCount"></b></div>
                    </div>
                </div>
                <div id="goalsActive"></div>
                <details class="fold hidden" id="pausedBox"><summary id="pausedSummary"></summary><div id="goalsPaused"></div></details>
                <details class="fold hidden" id="doneBox"><summary id="doneSummary"></summary><div id="goalsDone"></div></details>
            </div>
        </section>

        <!-- History -->
        <section class="view hidden" data-view="history">
            <div class="view-head"><h1 data-i18n="tabHistory"></h1></div>
            <div class="view-error hidden" id="historyError"></div>
            <div id="historyContent">
                <div class="hero history">
                    <div class="hero-label" data-i18n="last7"></div>
                    <div class="hero-pills" id="historyHero" style="margin-top:10px"></div>
                </div>
                <div class="card">
                    <div class="card-title"><span data-i18n="heatTitle"></span></div>
                    <div class="heatmap" id="heatmap"></div>
                    <div class="legend" id="legend"></div>
                </div>
                <div class="card">
                    <div class="card-title"><span data-i18n="weeksTitle"></span></div>
                    <div id="weeks"></div>
                </div>
            </div>
        </section>
    </main>

    <nav class="tabbar hidden" id="tabbar">
        <button type="button" data-view="tasks">
            <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="3.5"/><path d="m8.5 9.6 1.8 1.8 3.6-3.7"/><path d="M8.5 15.5h7"/></svg></span>
            <span data-i18n="tabTasks"></span><i class="badge hidden" id="badge-tasks"></i>
        </button>
        <button type="button" data-view="habits">
            <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2.5 3 3-3 3"/><path d="M4 11V9.5a4 4 0 0 1 4-4h12"/><path d="m7 21.5-3-3 3-3"/><path d="M20 13v1.5a4 4 0 0 1-4 4H4"/></svg></span>
            <span data-i18n="tabHabits"></span><i class="badge hidden" id="badge-habits"></i>
        </button>
        <button type="button" data-view="accounting">
            <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="14" rx="3.2"/><path d="M16.5 13h1.5"/><path d="M5.5 6 15 3.2a1.6 1.6 0 0 1 2 1.5V6"/></svg></span>
            <span data-i18n="tabAccounting"></span>
        </button>
        <button type="button" data-view="goals">
            <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="0.9"/></svg></span>
            <span data-i18n="tabGoals"></span>
        </button>
        <button type="button" data-view="history">
            <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8"/><path d="M12 20V5"/><path d="M19 20v-5"/></svg></span>
            <span data-i18n="tabHistory"></span>
        </button>
    </nav>

    <div class="sheet-backdrop hidden" id="sheetBackdrop">
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-handle"></div>
            <h3 id="sheetTitle"></h3>
            <div id="sheetBody"></div>
            <div class="sheet-error hidden" id="sheetError"></div>
            <div class="sheet-actions" id="sheetActions"></div>
        </div>
    </div>

    <script src="assets/core.js?v=4"></script>
    <script src="assets/accounting.js?v=4"></script>
    <script src="assets/tasks.js?v=4"></script>
    <script>App.start();</script>
</body>
</html>
