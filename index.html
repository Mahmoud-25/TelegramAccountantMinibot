<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Expense Dashboard</title>
    
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }
        
        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 24px;
        }
        
        /* Loading Spinner */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 16px;
        }
        
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--tg-theme-hint-color, #e0e0e0);
            border-top-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 16px;
            color: var(--tg-theme-hint-color, #999999);
        }
        
        /* Empty State */
        .empty-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            text-align: center;
            padding: 40px 20px;
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 8px;
        }
        
        .empty-hint {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }
        
        /* Stats Cards */
        .stats-container {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 16px;
            border-radius: 12px;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--tg-theme-text-color, #000000);
        }
        
        /* Chart Container */
        .chart-container {
            display: none;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 24px;
            flex: 1;
        }
        
        .chart-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #000000);
        }
        
        #expenseChart {
            max-height: 300px;
        }
        
        /* Category List */
        .category-list {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 10px;
        }
        
        .category-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .category-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
        
        .category-name {
            font-size: 15px;
            font-weight: 500;
            color: var(--tg-theme-text-color, #000000);
        }
        
        .category-amount {
            font-size: 15px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
        }
        
        /* Currency Info Banner */
        .currency-info {
            display: none;
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999999);
            text-align: center;
        }
        
        .currency-info strong {
            color: var(--tg-theme-text-color, #000000);
        }
        
        /* Close Button */
        .close-button {
            width: 100%;
            padding: 16px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: auto;
        }
        
        .close-button:active {
            opacity: 0.8;
        }
        
        /* Error State */
        .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            color: #ff3b30;
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Expense Dashboard</h1>
        <p class="subtitle">Your spending overview</p>
        
        <!-- Loading State -->
        <div class="loading-container" id="loadingState">
            <div class="spinner"></div>
            <div class="loading-text">Loading your expenses...</div>
        </div>
        
        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📊</div>
            <div class="empty-text">No expenses recorded yet</div>
            <div class="empty-hint">Start tracking by sending expenses to your bot!</div>
        </div>
        
        <!-- Error State -->
        <div class="error-state" id="errorState">
            <div class="error-icon">⚠️</div>
            <div class="error-text">Could not load expenses</div>
            <div class="empty-hint">Please try again later</div>
        </div>
        
        <!-- Currency Info Banner -->
        <div class="currency-info" id="currencyInfo">
            <strong>💱 Multi-Currency:</strong> All amounts converted to USD
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-label">Total Spent</div>
                <div class="stat-value" id="totalAmount">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Expenses</div>
                <div class="stat-value" id="expenseCount">0</div>
            </div>
        </div>
        
        <!-- Chart -->
        <div class="chart-container" id="chartContainer">
            <div class="chart-title">Spending by Category</div>
            <canvas id="expenseChart"></canvas>
        </div>
        
        <!-- Category List -->
        <div class="category-list" id="categoryList"></div>
        
        <!-- Close Button -->
        <button class="close-button" onclick="window.Telegram.WebApp.close()">
            Close Dashboard
        </button>
    </div>
    
    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation();
        
        // Production webhook URL
        const WEBHOOK_URL = 'https://n8n.doktorautomata.shop/webhook/expense-dashboard';
        
        // Chart.js color palette (Telegram-friendly)
        const COLORS = [
            '#3390EC', '#FF3B30', '#34C759', '#FF9500', '#AF52DE',
            '#FF2D55', '#5AC8FA', '#FFCC00', '#FF6482', '#64D2FF'
        ];
        
        let chartInstance = null;
        
        // Fetch expense data
        async function loadExpenses() {
            try {
                const response = await fetch(WEBHOOK_URL);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                
                const data = await response.json();
                
                // Handle array response (n8n sometimes wraps in array)
                const expenseData = Array.isArray(data) ? data[0] : data;
                
                // Hide loading
                document.getElementById('loadingState').style.display = 'none';
                
                // Check if empty
                if (expenseData.isEmpty || expenseData.labels.length === 0) {
                    document.getElementById('emptyState').style.display = 'flex';
                    return;
                }
                
                // Display data
                displayStats(expenseData);
                displayChart(expenseData);
                displayCategoryList(expenseData);
                
                // Show currency info if multiple currencies detected
                if (expenseData.currencyBreakdown && Object.keys(expenseData.currencyBreakdown).length > 1) {
                    document.getElementById('currencyInfo').style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error loading expenses:', error);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'flex';
            }
        }
        
        // Display statistics
        function displayStats(data) {
            const currency = data.currency || 'USD';
            const symbol = currency === 'USD' ? '$' : currency === 'EUR' ? '€' : currency === 'GBP' ? '£' : currency;
            
            document.getElementById('totalAmount').textContent = 
                `${symbol}${data.totalExpenses.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('expenseCount').textContent = data.expenseCount;
            document.getElementById('statsContainer').style.display = 'grid';
        }
        
        // Display Chart.js doughnut chart
        function displayChart(data) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            // Destroy existing chart if any
            if (chartInstance) {
                chartInstance.destroy();
            }
            
            // Get theme colors
            const textColor = getComputedStyle(document.body)
                .getPropertyValue('--tg-theme-text-color') || '#000000';
            const hintColor = getComputedStyle(document.body)
                .getPropertyValue('--tg-theme-hint-color') || '#999999';
            
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: data.labels,
                    datasets: [{
                        data: data.values,
                        backgroundColor: COLORS.slice(0, data.labels.length),
                        borderWidth: 0,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: textColor,
                            titleColor: '#ffffff',
                            bodyColor: '#ffffff',
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: true,
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed;
                                    const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                    const percentage = ((value / total) * 100).toFixed(1);
                                    return `${label}: $${value.toFixed(2)} (${percentage}%)`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
            
            document.getElementById('chartContainer').style.display = 'block';
        }
        
        // Display category breakdown list
        function displayCategoryList(data) {
            const listContainer = document.getElementById('categoryList');
            listContainer.innerHTML = '';
            
            data.labels.forEach((label, index) => {
                const value = data.values[index];
                const percentage = ((value / data.totalExpenses) * 100).toFixed(1);
                const color = COLORS[index % COLORS.length];
                
                const item = document.createElement('div');
                item.className = 'category-item';
                item.innerHTML = `
                    <div class="category-left">
                        <div class="category-color" style="background-color: ${color}"></div>
                        <div class="category-name">${label}</div>
                    </div>
                    <div class="category-amount">$${value.toFixed(2)} (${percentage}%)</div>
                `;
                
                listContainer.appendChild(item);
            });
            
            listContainer.style.display = 'flex';
        }
        
        // Load data on page load
        loadExpenses();
    </script>
</body>
</html>
