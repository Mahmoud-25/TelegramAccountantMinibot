<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المهام</title>
    <!-- Old link: the tasks now live in the main app (index.html, Tasks tab).
         Telegram's login data travels in the #hash, so keep it when forwarding. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        try {
            var tg = window.Telegram && window.Telegram.WebApp;
            if (tg && tg.initData) sessionStorage.setItem('tg.initData', tg.initData);
        } catch (e) { /* storage unavailable */ }
        location.replace('index.html?tab=tasks' + location.hash);
    </script>
</head>
<body></body>
</html>
